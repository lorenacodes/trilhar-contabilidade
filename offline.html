<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#17244A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trilhar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<title>Sem conexão — Trilhar Contabilidade</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#17244A; color:#fff; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; text-align:center; padding:24px; box-sizing:border-box; }
  .card { max-width:360px; }
  img { width:96px; height:96px; border-radius:20px; margin-bottom:20px; }
  h1 { font-size:22px; margin:0 0 10px; }
  p { margin:0 0 22px; line-height:1.55; color:#c9d0e6; }
  button { background:#E8C86A; color:#17244A; border:0; border-radius:10px; padding:13px 22px; font-size:16px; font-weight:700; cursor:pointer; }
</style>
</head>
<body>
  <div class="card">
    <img src="/img/icon-192.png" alt="Trilhar Contabilidade">
    <h1>Sem conexão com a internet</h1>
    <p>Não foi possível carregar o portal agora. Confira seu Wi-Fi ou os dados móveis e tente de novo.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
