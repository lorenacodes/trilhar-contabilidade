<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal do Cliente — Trilhar Contabilidade</title>
<link rel="icon" type="image/png" href="img/logo-glyph-dark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=104">
</head>
<body>
<div class="auth-atmosphere">
  <div class="auth-glass-card login-graphic">
    <div class="auth-glass-logo">
      <div class="brand-mark"><img src="img/logo-glyph-dark.png" alt="Trilhar Contabilidade"></div>
      <div class="brand-name">Trilhar Contabilidade</div>
    </div>

    <div class="auth-type-toggle" id="auth-type-toggle">
      <button type="button" class="auth-type-option" data-tipo="cliente">Cliente</button>
      <button type="button" class="auth-type-option" data-tipo="administrador">Administrador</button>
    </div>
    <p class="auth-type-caption" id="auth-type-caption"></p>

    <div class="field">
      <label>E-mail</label>
      <input type="email" id="login-email" placeholder="seuemail@exemplo.com">
    </div>
    <div class="field">
      <label>Senha</label>
      <div class="password-field-wrap">
        <input type="password" id="login-password" placeholder="••••••••">
        <button type="button" class="password-toggle-btn" data-password-toggle="login-password"></button>
      </div>
    </div>
    <p class="field-error" id="login-error"></p>

    <button class="btn btn-primary" id="login-btn">Entrar</button>

    <div class="login-footnote">
      Acesso fornecido pela Trilhar Contabilidade.<br>
      <a href="esqueci-senha">Esqueci minha senha</a>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js?v=80"></script>
<script src="js/app.js?v=83"></script>
<script>
  // Tela única com seletor Cliente/Administrador no topo (substitui as duas
  // páginas separadas de antes, index.html + admin-login.html) — pedido:
  // o tipo de acesso tinha pouco destaque (link pequeno no rodapé) e devia
  // ficar "impossível de ignorar" sem virar uma etapa a mais antes do login.
  // admin-login.html continua existindo só como um redirecionamento (pra
  // quem tem o link salvo ou é mandado pra lá pelo auth-guard) que cai
  // aqui já com "Administrador" selecionado.
  const TIPO_TEXTOS = {
    cliente: {
      caption: "Acesse seus documentos e informações",
      placeholderEmail: "seuemail@exemplo.com",
      erroPermissao: "Este e-mail não tem permissão para acessar o sistema. Fale com a Trilhar Contabilidade.",
      destinoPrimeiroAcesso: "primeiro-acesso",
      destinoPainel: "dashboard",
    },
    administrador: {
      caption: "Gerencie clientes e operações do sistema",
      placeholderEmail: "seuemail@trilharcontabilidade.com",
      erroPermissao: "Este e-mail não tem permissão para acessar o sistema. Fale com a Trilhar Contabilidade.",
      destinoPrimeiroAcesso: "primeiro-acesso",
      destinoPainel: "admin",
    },
  };
  const CHAVE_TIPO_LEMBRADO = "portal_tipo_acesso";

  let tipoAtual = "cliente";
  function aplicarTipoAcesso(tipo) {
    tipoAtual = tipo;
    document.querySelectorAll("#auth-type-toggle .auth-type-option").forEach(btn => btn.classList.toggle("active", btn.dataset.tipo === tipo));
    document.getElementById("auth-type-caption").textContent = TIPO_TEXTOS[tipo].caption;
    document.getElementById("login-email").placeholder = TIPO_TEXTOS[tipo].placeholderEmail;
    try { localStorage.setItem(CHAVE_TIPO_LEMBRADO, tipo); } catch (_) {}
  }
  document.querySelectorAll("#auth-type-toggle .auth-type-option").forEach(btn => {
    btn.addEventListener("click", () => aplicarTipoAcesso(btn.dataset.tipo));
  });

  let tipoLembrado = "cliente";
  try { if (localStorage.getItem(CHAVE_TIPO_LEMBRADO) === "administrador") tipoLembrado = "administrador"; } catch (_) {}
  aplicarTipoAcesso(tipoLembrado);

  const loginBtn = document.getElementById("login-btn");
  const loginError = document.getElementById("login-error");

  function showLoginError(msg) {
    loginError.textContent = msg;
    loginError.classList.add("show");
  }

  const params = new URLSearchParams(window.location.search);
  if (params.get("erro") === "sem_permissao") {
    showLoginError(TIPO_TEXTOS[tipoAtual].erroPermissao);
  } else if (params.get("senha_redefinida") === "1") {
    showToast("Senha redefinida com sucesso. Faça login com a nova senha.");
  }

  async function handleLogin() {
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;
    loginError.classList.remove("show");

    if (!email || !password) {
      showLoginError("Preencha e-mail e senha.");
      return;
    }

    loginBtn.disabled = true;
    loginBtn.classList.add("btn-loading");
    const original = loginBtn.textContent;
    loginBtn.innerHTML = ICONS.spinner + " Entrando...";

    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      showLoginError("E-mail ou senha incorretos.");
      loginBtn.disabled = false;
      loginBtn.classList.remove("btn-loading");
      loginBtn.textContent = original;
      return;
    }

    const { data: usuario, error: usuarioError } = await sb
      .from("users")
      .select("tipo, status, primeiro_acesso")
      .eq("auth_user_id", data.user.id)
      .maybeSingle();

    if (usuarioError || !usuario || usuario.tipo !== tipoAtual || usuario.status !== "ativo") {
      await sb.auth.signOut();
      showLoginError(TIPO_TEXTOS[tipoAtual].erroPermissao);
      loginBtn.disabled = false;
      loginBtn.classList.remove("btn-loading");
      loginBtn.textContent = original;
      return;
    }

    const destino = TIPO_TEXTOS[tipoAtual];
    window.location.href = usuario.primeiro_acesso ? destino.destinoPrimeiroAcesso : destino.destinoPainel;
  }

  loginBtn.addEventListener("click", handleLogin);
  document.getElementById("login-password").addEventListener("keydown", (e) => {
    if (e.key === "Enter") handleLogin();
  });
</script>
</body>
</html>
